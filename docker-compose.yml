
services:

  postgres:
    # 18 para igualar la versión del servidor de producción (PostgreSQL 18.4)
    image: postgres:18-alpine
    container_name: elevate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elevate_user
      POSTGRES_PASSWORD: elevate_pass123
      POSTGRES_DB: elevate_db
    ports:
      # 5435 en el host: 5433 suele chocar con Postgres nativo de Windows
      - "5435:5432"
    volumes:
      # PG18+ espera el mount en /var/lib/postgresql (los datos van a un subdirectorio por versión)
      - elevate_postgres_data:/var/lib/postgresql

volumes:
  elevate_postgres_data:
